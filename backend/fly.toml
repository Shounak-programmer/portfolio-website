# ─── Fly.io Configuration ─────────────────────────────────────
# Docs: https://fly.io/docs/reference/configuration/
#
# Deploy with:
#   cd backend
#   fly deploy
#
# First-time setup:
#   fly launch --no-deploy
#   fly volumes create sqlite_data --size 1 --region sin
#   fly secrets set ADMIN_USERNAME=xxx ADMIN_PASSWORD=xxx ADMIN_TOKEN=xxx HUGGINGFACE_TOKEN=xxx
#   fly deploy

app = "shounak-portfolio-backend"
primary_region = "sin"  # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/contacts.db"
  ALLOWED_ORIGIN = "https://shounakchatterjee.tech"

[mounts]
  source = "sqlite_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
